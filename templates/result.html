
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            text-align: center;
            padding: 80px 20px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #183b66;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #183b66;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Prediction Result</h1>

        <p>Claim Status: {{ prediction }}</p>

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
